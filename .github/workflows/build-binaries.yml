# Tag a stable release (v1.2.3) to produce self-installing, versioned artifacts.
# Checksums are uploaded next to each archive; only tagged releases enable updates.
name: build-binaries

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            label: linux-x86_64
          - os: windows-2022
            label: windows-x86_64
          - os: macos-15-intel
            label: macos-x86_64
          - os: macos-15
            label: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build and test dependencies
        run: python -m pip install -r requirements.txt "Flask>=3.0" "waitress>=3.0" "qrcode>=7.4" pyinstaller
      - name: Stamp trusted release identity and version
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import os, pathlib, re
          root = pathlib.Path('pos')
          tag = os.environ['TAG']
          if os.environ['REF_TYPE'] == 'tag':
              if not re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+', tag):
                  raise SystemExit('Release tags must use vMAJOR.MINOR.PATCH')
              (root / '__init__.py').write_text('__version__ = ' + repr(tag[1:]) + '\n')
              (root / 'release_build.py').write_text(
                  'REPOSITORY = ' + repr(os.environ['REPOSITORY']) + '\nENABLED = True\n')
          PY
      - name: Run regression tests before packaging
        run: python -m unittest discover -s tests
      - name: Validate frontend modules
        run: node tests/check_frontend_modules.mjs
      - name: Build native app and graphical launcher
        run: |
          pyinstaller --noconfirm --clean pypos.spec
          pyinstaller --noconfirm --clean launcher.spec
      - name: Package with platform-specific names and checksums
        run: python package_native.py
      - uses: actions/upload-artifact@v4
        with:
          name: pypos-${{ matrix.label }}
          path: |
            dist/pypos-${{ matrix.label }}.zip
            dist/pypos-${{ matrix.label }}.zip.sha256
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*/*.zip
            artifacts/*/*.sha256
          generate_release_notes: true
