[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pypos"
dynamic = ["version"]
description = "A simple, practical point-of-sale system for small shops — runs entirely on your machine."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "pyPOS contributors" }]
requires-python = ">=3.10"
dependencies = ["Flask>=3.0"]
keywords = ["point-of-sale", "pos", "retail", "sqlite", "offline"]
classifiers = [
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial :: Point-Of-Sale",
]

[project.urls]
Homepage = "https://github.com/example/pypos"

[project.scripts]
pypos = "pos.cli:main"

[tool.setuptools]
packages = ["pos"]

[tool.setuptools.dynamic]
version = { attr = "pos.__version__" }

[tool.setuptools.package-data]
pos = [
    "schema.sql",
    "templates/*.html",
    "static/css/*",
    "static/js/*",
    "static/js/views/*",
    "static/fonts/*",
]
